<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gentrit Rashiti</title>
    <meta
      name="description"
      content="Gentrit Rashiti, frontend and mobile developer moving to full stack. Web and mobile products in healthcare, video streaming, e-reading and Web3."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gentrit Rashiti" />
    <meta
      property="og:description"
      content="Gentrit Rashiti, frontend and mobile developer moving to full stack. Web and mobile products in healthcare, video streaming, e-reading and Web3."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1012" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Atkinson+Hyperlegible+Next:wght@400..700&family=Martian+Mono:wdth,wght@75..100,400..500&display=swap"
    />
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ebedf0');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
