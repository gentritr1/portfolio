    />
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ebedf0');
          }
        }
      })();
    </script>
