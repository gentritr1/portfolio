<!doctype html>
<html lang="en" data-world="base">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gentrit Rashiti</title>
    <meta
      name="description"
      content="Gentrit Rashiti, frontend and mobile developer moving to full stack. Web and mobile products in healthcare, video streaming, e-reading and Web3."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gentrit Rashiti" />
    <meta
      property="og:description"
      content="Gentrit Rashiti, frontend and mobile developer moving to full stack. Web and mobile products in healthcare, video streaming, e-reading and Web3."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..700&family=Geist+Mono:wght@400..500&family=Geist:wght@300..600&display=swap"
    />
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', theme === 'dark' ? '#121418' : '#f3f5f8');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
