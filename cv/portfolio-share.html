<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio sharing card</title>
  <style>
    @font-face { font-family: Archivo; src: url('/fonts/Archivo.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #080a0d; color: #f0f1f2; font-family: Archivo, sans-serif; }
    main { position: relative; height: 100%; padding: 58px 56px; }
    .name { margin: 0; font-size: 24px; font-weight: 550; }
    h1 { max-width: 565px; margin: 66px 0 26px; font-size: 54px; font-weight: 500; line-height: 1.07; letter-spacing: -0.035em; }
    .role { font-size: 23px; margin: 0; color: #b9dce6; }
    .experience { font-size: 20px; line-height: 1.5; margin-top: 35px; color: #bec3cb; }
    figure { position: absolute; left: 670px; top: 130px; width: 800px; margin: 0; }
    img { display: block; width: 800px; height: 500px; object-fit: cover; border-radius: 8px 0 0 0; }
    figcaption { position: absolute; top: -38px; left: 0; font-size: 16px; color: #bec3cb; }
  </style>
</head>
<body>
  <main>
    <p class="name">Gentrit Rashiti</p>
    <h1>I build web and mobile products, from interface to backend.</h1>
    <p class="role">Software Engineer</p>
    <p class="experience">5+ years shipping products.<br>Kosovo, working remotely.</p>
    <figure>
      <img src="/showcase/care-dashboard/appointments-week.webp" alt="Care-platform calendar with invented data." width="1440" height="900">
      <figcaption>Real product screen, invented data.</figcaption>
    </figure>
  </main>
</body>
</html>
